<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lịch học">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Lịch cá nhân</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">LỊCH CÁ NHÂN</div>
    <h1 id="pageTitle">Hôm nay</h1>
  </div>
  <button class="icon-btn" id="syncBtn" aria-label="Đồng bộ">↻</button>
</header>

<main>
  <section id="home" class="page active">
    <div id="summaryCard" class="hero-card"></div>

    <div class="day-toolbar">
      <div>
        <div class="eyebrow">HÔM NAY</div>
        <h2 id="todayLabel"></h2>
      </div>
      <button id="finalizeBtn" class="secondary small-btn">Lưu ngày</button>
    </div>

    <div id="todayList" class="timeline"></div>
    <p class="hint center-hint">Chạm vào một task để xem chi tiết.</p>
  </section>

  <section id="week" class="page">
    <div class="section-head">
      <div>
        <div class="eyebrow">LỊCH ĐÃ LƯU</div>
        <h2>Tuần này</h2>
      </div>
      <button id="weekTodayBtn" class="text-btn">Hôm nay</button>
    </div>
    <div id="weekStrip" class="week-strip"></div>
    <div id="weekContent"></div>
  </section>

  <section id="subjects" class="page">
    <div class="section-head"><h2>Môn / nhóm việc</h2></div>
    <div id="subjectList"></div>
  </section>

  <section id="settings" class="page">
    <div class="section-head"><h2>Cài đặt</h2></div>
    <div class="settings-card">
      <label>Apps Script Web App URL
        <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      </label>
      <label>API token nếu Apps Script đã bật token
        <input id="apiToken" type="password" placeholder="Không bắt buộc" autocomplete="off">
      </label>
      <label>Nhắc trước
        <select id="reminderMinutes">
          <option value="5">5 phút</option>
          <option value="10">10 phút</option>
          <option value="15" selected>15 phút</option>
          <option value="30">30 phút</option>
          <option value="60">60 phút</option>
        </select>
      </label>
      <div class="settings-actions">
        <button id="saveSettings" class="primary">Lưu & đồng bộ</button>
        <button id="notifyBtn" class="secondary">Cho phép thông báo</button>
        <button id="demoBtn" class="secondary">Dữ liệu mẫu</button>
      </div>
      <p class="hint">Lịch hôm nay được lấy từ Google Sheet. Các ngày đã chốt được lưu trên thiết bị để xem lại theo tuần.</p>
    </div>
    <div class="settings-card">
      <h3>Trạng thái</h3>
      <div id="status">Chưa đồng bộ</div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button data-page="home" class="nav-item active"><span>⌂</span><small>Hôm nay</small></button>
  <button data-page="week" class="nav-item"><span>▦</span><small>Tuần</small></button>
  <button data-page="subjects" class="nav-item"><span>◫</span><small>Môn</small></button>
  <button data-page="settings" class="nav-item"><span>⚙</span><small>Cài đặt</small></button>
</nav>

<div id="taskModal" class="task-page hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="task-page-topbar">
    <button class="back-btn" data-close-modal aria-label="Quay lại">‹</button>
    <div>
      <div class="eyebrow">TASK DETAILS</div>
      <strong>Chi tiết công việc</strong>
    </div>
    <button class="icon-btn ghost" data-close-modal aria-label="Đóng">×</button>
  </div>
  <div class="task-page-scroll">
    <div class="detail-hero">
      <div class="detail-icon">✓</div>
      <div class="detail-category">TASK</div>
      <h2 id="modalTitle"></h2>
      <div id="modalMeta" class="modal-meta"></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Mô tả</div>
      <div id="modalDescription" class="modal-description"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
